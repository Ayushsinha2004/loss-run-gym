[project]
name = "loss-run-gym"
version = "0.1.0"
description = "Synthetic insurance loss runs with realistic extraction traps, plus a scorer"
readme = "README.md"
authors = [
    { name = "Ayush Sinha", email = "ayusharyansinha21@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "pdfplumber>=0.11.10",
    "reportlab>=5.1.0",
    "scipy>=1.18.1",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[project.scripts]
lrg = "loss_run_gym.cli:main"
